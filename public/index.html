<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GooberCraft Master - Node & Bot Paneli</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --green: #10b981;
      --yellow: #f59e0b;
      --red: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem;
    }

    header {
      max-width: 1200px;
      margin: 0 auto 2.5rem auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand { display: flex; align-items: center; gap: 12px; }

    .brand-logo {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--accent), #a855f7);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.2rem;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .header-actions { display: flex; align-items: center; gap: 1rem; }
    .stats-summary { display: flex; gap: 1rem; }

    .stat-badge {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      backdrop-filter: blur(8px);
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .stat-badge span { color: var(--text); font-weight: 600; }

    /* BOT EKLE BUTONU */
    .btn-add-bot {
      background: linear-gradient(135deg, var(--accent), #a855f7);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-add-bot:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(99, 102, 241, 0.5);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.5rem;
    }

    .server-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.5rem;
      backdrop-filter: blur(12px);
      transition: transform 0.2s ease;
    }

    .server-card:hover { transform: translateY(-4px); }

    .server-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .server-title { font-size: 1.1rem; font-weight: 600; }

    .status-indicator {
      display: flex; align-items: center; gap: 6px; font-size: 0.8rem;
      padding: 4px 10px; border-radius: 20px; background: rgba(16, 185, 129, 0.1); color: var(--green);
    }

    .status-indicator.offline { background: rgba(239, 68, 68, 0.1); color: var(--red); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: var(--green); }
    .status-indicator.offline .status-dot { background-color: var(--red); }

    .bot-capacity { margin-bottom: 1rem; }
    .capacity-info { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem; }

    .progress-bar { width: 100%; height: 8px; background: rgba(255, 255, 255, 0.05); border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #818cf8); border-radius: 4px; }

    .bot-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 1.2rem; min-height: 30px; }
    .bot-chip { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.05); padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; color: var(--text-muted); }
    .bot-chip.active { color: var(--text); border-color: rgba(99, 102, 241, 0.3); }

    .empty-state { text-align: center; grid-column: 1 / -1; padding: 4rem; background: var(--card-bg); border-radius: 16px; border: 1px solid var(--card-border); color: var(--text-muted); }

    /* MODAL AÇILIR PENCERE */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center; z-index: 1000;
    }
    .modal-overlay.show { display: flex; }

    .modal {
      background: #1e293b; border: 1px solid var(--card-border);
      border-radius: 16px; padding: 2rem; width: 100%; max-width: 420px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .modal-title { font-size: 1.2rem; font-weight: 700; }
    .btn-close { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }

    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem; }
    .form-group input {
      width: 100%; background: #0f172a; border: 1px solid var(--card-border);
      padding: 0.75rem 1rem; border-radius: 8px; color: white; outline: none;
    }
    .form-group input:focus { border-color: var(--accent); }

    .btn-submit {
      width: 100%; background: var(--accent); color: white; border: none;
      padding: 0.8rem; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 0.5rem;
    }
    .btn-submit:hover { background: var(--accent-hover); }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-logo">G</div>
      <div>
        <h1>GooberCraft Master</h1>
        <p style="font-size: 0.85rem; color: var(--text-muted);">Node & Bot Ağ Yönetimi</p>
      </div>
    </div>

    <div class="header-actions">
      <div class="stats-summary">
        <div class="stat-badge">Toplam Node: <span id="total-nodes">0</span></div>
        <div class="stat-badge">Aktif Botlar: <span id="total-bots">0</span></div>
      </div>
      <!-- İŞTE BURADA! -->
      <button class="btn-add-bot" onclick="openModal()">➕ Bot Ekle</button>
    </div>
  </header>

  <div class="container" id="server-container">
    <div class="empty-state">Yükleniyor veya henüz aktif Node/Server bulunamadı...</div>
  </div>

  <!-- AÇILIR FORM PENCERESİ (MODAL) -->
  <div class="modal-overlay" id="addBotModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">🤖 Yeni Bot Ekle</div>
        <button class="btn-close" onclick="closeModal()">&times;</button>
      </div>
      <form id="addBotForm" onsubmit="handleAddBot(event)">
        <div class="form-group">
          <label>Bot Kullanıcı Adı (Username)</label>
          <input type="text" id="botUsername" placeholder="Örn: Goob_Bot" required>
        </div>
        <div class="form-group">
          <label>Minecraft Sunucu IP / Host</label>
          <input type="text" id="botHost" placeholder="Örn: play.hypixel.net" required>
        </div>
        <div class="form-group">
          <label>Port</label>
          <input type="number" id="botPort" value="25565" required>
        </div>
        <button type="submit" class="btn-submit">En Boş Sunucuya Atarak Başlat 🚀</button>
      </form>
    </div>
  </div>

  <script>
    function openModal() { document.getElementById('addBotModal').classList.add('show'); }
    function closeModal() { document.getElementById('addBotModal').classList.remove('show'); }

    async function handleAddBot(e) {
      e.preventDefault();
      const username = document.getElementById('botUsername').value;
      const host = document.getElementById('botHost').value;
      const port = Number(document.getElementById('botPort').value);

      try {
        const res = await fetch('/api/bots/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, host, port })
        });

        const data = await res.json();
        if (data.success) {
          alert('✅ ' + data.message);
          closeModal();
          fetchDashboardData();
        } else {
          alert('❌ Hata: ' + (data.message || 'Bot eklenemedi.'));
        }
      } catch (err) {
        alert('❌ Sunucuya bağlanırken hata oluştu.');
      }
    }

    async function fetchDashboardData() {
      try {
        const [nodesRes, botsRes] = await Promise.all([
          fetch('/api/nodes'),
          fetch('/api/bots')
        ]);

        const nodesData = await nodesRes.json();
        const botsData = await botsRes.json();

        const nodes = nodesData.nodes || [];
        const bots = botsData.bots || [];

        document.getElementById('total-nodes').innerText = nodes.length;
        document.getElementById('total-bots').innerText = bots.length;

        const container = document.getElementById('server-container');
        if (nodes.length === 0) {
          container.innerHTML = '<div class="empty-state">Henüz bağlı olan aktif Node (Server) bulunmuyor.</div>';
          return;
        }

        container.innerHTML = nodes.map(node => {
          const maxBots = node.maxBots || 10;
          const nodeBots = bots.filter(b => b.nodeId === node.id);
          const currentBots = nodeBots.length || node.currentBots || 0;
          const percentage = Math.min((currentBots / maxBots) * 100, 100);
          
          let fillStyle = "background: linear-gradient(90deg, var(--accent), #818cf8);";
          if (percentage >= 100) fillStyle = "background: var(--red);";
          else if (percentage >= 80) fillStyle = "background: var(--yellow);";

          const botChipsHtml = nodeBots.length > 0 
            ? nodeBots.map(b => `<span class="bot-chip active">🤖 ${b.username}</span>`).join('')
            : `<span class="bot-chip">Bot Yok</span>`;

          return `
            <div class="server-card">
              <div class="server-header">
                <div class="server-title">🌐 ${node.name || node.id}</div>
                <div class="status-indicator ${node.online ? '' : 'offline'}">
                  <div class="status-dot"></div> ${node.online ? 'Aktif' : 'Çevrimdışı'}
                </div>
              </div>
              <div class="bot-capacity">
                <div class="capacity-info">
                  <span>Bot Kapasitesi</span>
                  <span><strong>${currentBots}</strong> / ${maxBots} Bot</span>
                </div>
                <div class="progress-bar">
                  <div class="progress-fill" style="width: ${percentage}%; ${fillStyle}"></div>
                </div>
              </div>
              <div class="bot-list">
                ${botChipsHtml}
              </div>
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error("Dashboard verisi çekilirken hata oluştu:", err);
      }
    }

    setInterval(fetchDashboardData, 3000);
    fetchDashboardData();
  </script>
</body>
</html>
