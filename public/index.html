<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <!-- Tarayıcı Önbelleğini (Cache) Tamamen Engelleme -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GooberCraft Master - Data Center Cluster</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #050811;
      --card-bg: rgba(13, 18, 30, 0.85);
      --card-border: #1e293b;
      --rack-border: #334155;
      --accent: #6366f1;
      --cyan: #06b6d4;
      --green: #10b981;
      --yellow: #f59e0b;
      --red: #ef4444;
      --text: #f8fafc;
      --text-muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.12) 0%, transparent 70%),
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
      color: var(--text);
      min-height: 100vh;
      padding: 2rem;
    }

    header {
      max-width: 1200px;
      margin: 0 auto 2.5rem auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 1.5rem;
    }

    .brand { display: flex; align-items: center; gap: 14px; }

    .brand-logo {
      width: 48px;
      height: 48px;
      background: #090d16;
      border: 1px solid var(--accent);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 1.4rem;
      color: var(--cyan);
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.25);
    }

    .brand h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px; }

    .header-actions { display: flex; align-items: center; gap: 1rem; }
    .stats-summary { display: flex; gap: 0.75rem; }

    .stat-badge {
      background: #090d16;
      border: 1px solid var(--card-border);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stat-badge span { color: var(--cyan); font-weight: 700; font-size: 1.05rem; }

    .btn-add-bot {
      background: linear-gradient(135deg, var(--accent), #4338ca);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 0.65rem 1.3rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
      transition: all 0.2s ease;
    }

    .btn-add-bot:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(99, 102, 241, 0.5);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 1.5rem;
    }

    /* OPENAI SERVER RACK TASARIMI */
    .server-card {
      background: var(--card-bg);
      border: 2px solid var(--rack-border);
      border-radius: 12px;
      padding: 1.25rem;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8), 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .server-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--cyan), var(--accent));
    }

    .server-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--card-border);
    }

    .server-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* SUNUCU LED IŞIKLARI */
    .led-group { display: flex; gap: 6px; align-items: center; }
    .led {
      width: 8px; height: 8px; border-radius: 50%;
      background: #1e293b;
    }
    .led.green { background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 2s infinite; }
    .led.blue { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); animation: pulse 1.5s infinite; }
    .led.red { background: var(--red); box-shadow: 0 0 8px var(--red); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .server-metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-bottom: 1rem;
      background: #080c14;
      padding: 0.6rem;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.03);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .metric-val { color: var(--text); font-weight: 600; }

    .bot-capacity { margin-bottom: 1rem; }
    .capacity-info {
      display: flex; justify-content: space-between;
      font-size: 0.8rem; color: var(--text-muted);
      margin-bottom: 0.4rem; font-family: 'JetBrains Mono', monospace;
    }

    .progress-bar {
      width: 100%; height: 6px;
      background: #090d16;
      border-radius: 3px; overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .progress-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; }

    .bot-list {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin-top: 0.8rem; min-height: 38px; align-items: center;
      background: rgba(0,0,0,0.3); padding: 6px; border-radius: 8px;
    }
    
    .bot-chip {
      background: #0f172a;
      border: 1px solid var(--card-border);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    
    .bot-chip.mine {
      color: var(--cyan);
      border-color: rgba(6, 182, 212, 0.4);
      background: rgba(6, 182, 212, 0.1);
    }

    .bot-chip .btn-stop {
      color: #fca5a5;
      cursor: pointer;
      font-weight: bold;
      padding: 0 4px;
      border-radius: 3px;
      transition: background 0.2s;
    }

    .bot-chip .btn-stop:hover {
      background: rgba(239, 68, 68, 0.5);
      color: white;
    }

    .empty-state {
      text-align: center;
      grid-column: 1 / -1;
      padding: 4rem 2rem;
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px dashed var(--card-border);
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    /* MODAL FORM */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 8, 17, 0.85); backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center; z-index: 1000;
    }
    .modal-overlay.show { display: flex; }

    .modal {
      background: #0d121e; border: 1px solid var(--rack-border);
      border-radius: 14px; padding: 2rem; width: 100%; max-width: 420px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
    }

    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .modal-title { font-size: 1.15rem; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
    .btn-close { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }

    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.4rem; font-family: 'JetBrains Mono', monospace; }
    .form-group input {
      width: 100%; background: #050811; border: 1px solid var(--card-border);
      padding: 0.75rem 1rem; border-radius: 8px; color: white; outline: none;
      font-family: 'JetBrains Mono', monospace;
    }
    .form-group input:focus { border-color: var(--cyan); }

    .btn-submit {
      width: 100%; background: linear-gradient(135deg, var(--accent), #4338ca); color: white; border: none;
      padding: 0.8rem; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 0.5rem;
      font-family: 'JetBrains Mono', monospace;
    }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-logo">OA</div>
      <div>
        <h1>GooberCraft DataCenter</h1>
        <p style="font-size: 0.8rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace;">Cluster Rack & Bot Infrastructure</p>
      </div>
    </div>

    <div class="header-actions">
      <div class="stats-summary">
        <div class="stat-badge">NODES: <span id="total-nodes">0</span></div>
        <div class="stat-badge">BOTS: <span id="total-bots">0</span></div>
      </div>
      <button class="btn-add-bot" onclick="openModal()">+ BOT DEPLOY</button>
    </div>
  </header>

  <div class="container" id="server-container">
    <div class="empty-state">Cluster verileri senkronize ediliyor...</div>
  </div>

  <!-- AÇILIR FORM PENCERESİ -->
  <div class="modal-overlay" id="addBotModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">🖥️ BOT DEPLOYMENT</div>
        <button class="btn-close" onclick="closeModal()">&times;</button>
      </div>
      <form id="addBotForm" onsubmit="handleAddBot(event)">
        <div class="form-group">
          <label>BOT USERNAME</label>
          <input type="text" id="botUsername" placeholder="Goob_Bot_01" required>
        </div>
        <div class="form-group">
          <label>MINECRAFT HOST IP</label>
          <input type="text" id="botHost" placeholder="play.hypixel.net" required>
        </div>
        <div class="form-group">
          <label>PORT</label>
          <input type="number" id="botPort" value="25565" required>
        </div>
        <button type="submit" id="submitBtn" class="btn-submit">DEPLOY TO NODE 🚀</button>
      </form>
    </div>
  </div>

  <script>
    // 🔑 EŞSİZ KULLANICI TOKENI
    function getOwnerToken() {
      let token = localStorage.getItem('goober_owner_token');
      if (!token) {
        token = 'usr_' + Math.random().toString(36).substring(2, 9) + Date.now().toString(36);
        localStorage.setItem('goober_owner_token', token);
      }
      return token;
    }

    const MY_OWNER_TOKEN = getOwnerToken();

    function openModal() { document.getElementById('addBotModal').classList.add('show'); }
    function closeModal() { document.getElementById('addBotModal').classList.remove('show'); }

    function extractArray(apiResponse, key) {
      if (Array.isArray(apiResponse)) return apiResponse;
      if (apiResponse && typeof apiResponse === 'object') {
        if (Array.isArray(apiResponse[key])) return apiResponse[key];
        if (Array.isArray(apiResponse.data)) return apiResponse.data;
      }
      return [];
    }

    async function handleAddBot(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      const username = document.getElementById('botUsername').value.trim();
      const host = document.getElementById('botHost').value.trim();
      const port = Number(document.getElementById('botPort').value);

      submitBtn.disabled = true;
      submitBtn.innerText = 'DEPLOYING... ⏳';

      try {
        const res = await fetch('/api/bots/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, host, port, ownerToken: MY_OWNER_TOKEN })
        });

        const data = await res.json();
        if (data.success) {
          closeModal();
          document.getElementById('addBotForm').reset();
          document.getElementById('botPort').value = '25565';
          await fetchDashboardData();
        } else {
          alert('❌ Deployment Failed: ' + (data.message || 'Hata oluştu.'));
        }
      } catch (err) {
        alert('❌ Sunucu iletişim hatası.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'DEPLOY TO NODE 🚀';
      }
    }

    async function stopBot(botId, username) {
      if (!confirm(`'${username}' botunu durdurmak istediğinize emin misiniz?`)) return;

      try {
        const res = await fetch('/api/bots/stop', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: botId, ownerToken: MY_OWNER_TOKEN })
        });

        const data = await res.json();
        if (data.success) {
          await fetchDashboardData();
        } else {
          alert('❌ ' + (data.message || 'Bot durdurulamadı.'));
        }
      } catch (err) {
        alert('❌ Sunucu iletişim hatası.');
      }
    }

    async function fetchDashboardData() {
      try {
        const [nodesRes, botsRes] = await Promise.all([
          fetch('/api/nodes?t=' + Date.now()),
          fetch('/api/bots?t=' + Date.now())
        ]);

        const rawNodes = await nodesRes.json();
        const rawBots = await botsRes.json();

        const nodes = extractArray(rawNodes, 'nodes');
        const bots = extractArray(rawBots, 'bots');

        document.getElementById('total-nodes').innerText = nodes.length;
        document.getElementById('total-bots').innerText = bots.length;

        const container = document.getElementById('server-container');
        if (nodes.length === 0) {
          container.innerHTML = '<div class="empty-state">Aktif Node bulunamadı. Cluster bekleniyor...</div>';
          return;
        }

        container.innerHTML = nodes.map(node => {
          const maxBots = node.maxBots || 10;
          const nodeBots = bots.filter(b => b.nodeId === node.id || b.node_id === node.id);
          const currentBots = nodeBots.length || node.currentBots || 0;
          const percentage = Math.min((currentBots / maxBots) * 100, 100);
          
          let fillStyle = "background: var(--cyan); box-shadow: 0 0 10px var(--cyan);";
          if (percentage >= 100) fillStyle = "background: var(--red); box-shadow: 0 0 10px var(--red);";
          else if (percentage >= 80) fillStyle = "background: var(--yellow); box-shadow: 0 0 10px var(--yellow);";

          const botChipsHtml = nodeBots.length > 0 
            ? nodeBots.map(b => {
                const isMyBot = b.ownerToken === MY_OWNER_TOKEN;
                return `
                  <span class="bot-chip ${isMyBot ? 'mine' : ''}">
                    🤖 ${b.username}
                    ${isMyBot ? `<span class="btn-stop" title="Durdur" onclick="stopBot('${b.id}', '${b.username}')">✕</span>` : ''}
                  </span>
                `;
              }).join('')
            : `<span class="bot-chip" style="opacity: 0.5;">SLOT EMPTY</span>`;

          const isOnline = node.online !== false;

          return `
            <div class="server-card">
              <div>
                <div class="server-header">
                  <div class="server-title">
                    <span style="color: var(--cyan);">[RACK-01]</span> ${node.name || node.id}
                  </div>
                  <div class="led-group">
                    <div class="led ${isOnline ? 'green' : 'red'}" title="Power Status"></div>
                    <div class="led ${isOnline ? 'blue' : ''}" title="Network Link"></div>
                  </div>
                </div>

                <div class="server-metrics">
                  <div>CPU: <span class="metric-val">${Math.floor(Math.random() * 15 + 5)}%</span></div>
                  <div>RAM: <span class="metric-val">1.2 GB</span></div>
                  <div>UPTIME: <span class="metric-val">99.9%</span></div>
                  <div>LATENCY: <span class="metric-val">12ms</span></div>
                </div>

                <div class="bot-capacity">
                  <div class="capacity-info">
                    <span>CAPACITY</span>
                    <span><strong>${currentBots}</strong> / ${maxBots} UNITS</span>
                  </div>
                  <div class="progress-bar">
                    <div class="progress-fill" style="width: ${percentage}%; ${fillStyle}"></div>
                  </div>
                </div>
              </div>

              <div class="bot-list">
                ${botChipsHtml}
              </div>
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error("Cluster güncelleme hatası:", err);
      }
    }

    setInterval(fetchDashboardData, 3000);
    fetchDashboardData();
  </script>
</body>
</html>
