<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GooberCraft Master - Node & Bot Paneli</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.75);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --green: #10b981;
      --yellow: #f59e0b;
      --red: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem;
    }

    header {
      max-width: 1200px;
      margin: 0 auto 2.5rem auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .brand { display: flex; align-items: center; gap: 12px; }

    .brand-logo {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--accent), #a855f7);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.3rem;
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.4);
    }

    .header-actions { display: flex; align-items: center; gap: 1rem; }
    .stats-summary { display: flex; gap: 0.75rem; }

    .stat-badge {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 0.5rem 1rem;
      border-radius: 10px;
      backdrop-filter: blur(8px);
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-badge span { color: var(--text); font-weight: 700; font-size: 1rem; }

    .btn-add-bot {
      background: linear-gradient(135deg, var(--accent), #a855f7);
      color: white;
      border: none;
      padding: 0.65rem 1.3rem;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
      transition: all 0.2s ease;
    }

    .btn-add-bot:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 1.5rem;
    }

    .server-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.5rem;
      backdrop-filter: blur(12px);
      transition: transform 0.25s ease, border-color 0.25s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .server-card:hover {
      transform: translateY(-4px);
      border-color: rgba(99, 102, 241, 0.3);
    }

    .server-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; }
    .server-title { font-size: 1.15rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }

    .status-indicator {
      display: flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 600;
      padding: 4px 10px; border-radius: 20px; background: rgba(16, 185, 129, 0.15); color: var(--green);
    }

    .status-indicator.offline { background: rgba(239, 68, 68, 0.15); color: var(--red); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: var(--green); box-shadow: 0 0 8px var(--green); }
    .status-indicator.offline .status-dot { background-color: var(--red); box-shadow: 0 0 8px var(--red); }

    .bot-capacity { margin-bottom: 1.2rem; }
    .capacity-info { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.5rem; }

    .progress-bar { width: 100%; height: 8px; background: rgba(255, 255, 255, 0.08); border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 4px; transition: width 0.4s ease, background 0.4s ease; }

    .bot-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 1rem; min-height: 36px; align-items: center; }
    
    .bot-chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    
    .bot-chip.mine {
      color: var(--text);
      border-color: rgba(99, 102, 241, 0.4);
      background: rgba(99, 102, 241, 0.15);
      font-weight: 500;
    }

    .bot-chip .btn-stop {
      color: #fca5a5;
      cursor: pointer;
      font-weight: bold;
      padding: 0 2px;
      border-radius: 4px;
      transition: background 0.2s;
    }

    .bot-chip .btn-stop:hover {
      background: rgba(239, 68, 68, 0.4);
      color: white;
    }

    .empty-state {
      text-align: center;
      grid-column: 1 / -1;
      padding: 4rem 2rem;
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px dashed var(--card-border);
      color: var(--text-muted);
      font-size: 1rem;
    }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.82); backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center; z-index: 1000;
      opacity: 0; transition: opacity 0.2s ease;
    }
    .modal-overlay.show { display: flex; opacity: 1; }

    .modal {
      background: #1e293b; border: 1px solid var(--card-border);
      border-radius: 20px; padding: 2rem; width: 100%; max-width: 440px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      transform: translateY(10px); transition: transform 0.2s ease;
    }
    .modal-overlay.show .modal { transform: translateY(0); }

    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .modal-title { font-size: 1.25rem; font-weight: 700; }
    .btn-close { background: none; border: none; color: var(--text-muted); font-size: 1.6rem; cursor: pointer; line-height: 1; }
    .btn-close:hover { color: white; }

    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem; font-weight: 500; }
    .form-group input {
      width: 100%; background: #0f172a; border: 1px solid var(--card-border);
      padding: 0.8rem 1rem; border-radius: 10px; color: white; outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus { border-color: var(--accent); }

    .btn-submit {
      width: 100%; background: linear-gradient(135deg, var(--accent), #a855f7); color: white; border: none;
      padding: 0.85rem; border-radius: 10px; font-weight: 600; cursor: pointer; margin-top: 0.5rem;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); transition: opacity 0.2s;
    }
    .btn-submit:hover { opacity: 0.95; }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-logo">G</div>
      <div>
        <h1>GooberCraft Master</h1>
        <p style="font-size: 0.85rem; color: var(--text-muted);">Node & Bot Ağ Yönetimi</p>
      </div>
    </div>

    <div class="header-actions">
      <div class="stats-summary">
        <div class="stat-badge">Toplam Node: <span id="total-nodes">0</span></div>
        <div class="stat-badge">Aktif Botlar: <span id="total-bots">0</span></div>
      </div>
      <button class="btn-add-bot" onclick="openModal()">➕ Bot Ekle</button>
    </div>
  </header>

  <div class="container" id="server-container">
    <div class="empty-state">Yükleniyor veya henüz aktif Node/Server bulunamadı...</div>
  </div>

  <!-- AÇILIR FORM PENCERESİ -->
  <div class="modal-overlay" id="addBotModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">🤖 Yeni Bot Ekle</div>
        <button class="btn-close" onclick="closeModal()">&times;</button>
      </div>
      <form id="addBotForm" onsubmit="handleAddBot(event)">
        <div class="form-group">
          <label>Bot Kullanıcı Adı (Username)</label>
          <input type="text" id="botUsername" placeholder="Örn: Goob_Bot" required>
        </div>
        <div class="form-group">
          <label>Minecraft Sunucu IP / Host</label>
          <input type="text" id="botHost" placeholder="Örn: play.hypixel.net" required>
        </div>
        <div class="form-group">
          <label>Port</label>
          <input type="number" id="botPort" value="25565" required>
        </div>
        <button type="submit" id="submitBtn" class="btn-submit">En Boş Sunucuya Atarak Başlat 🚀</button>
      </form>
    </div>
  </div>

  <script>
    // 🔑 KULLANICI İÇİN EŞSİZ SAHİPLİK TOKENI
    function getOwnerToken() {
      let token = localStorage.getItem('goober_owner_token');
      if (!token) {
        token = 'user_' + Math.random().toString(36).substring(2, 11) + Date.now().toString(36);
        localStorage.setItem('goober_owner_token', token);
      }
      return token;
    }

    const MY_OWNER_TOKEN = getOwnerToken();

    function openModal() { document.getElementById('addBotModal').classList.add('show'); }
    function closeModal() { document.getElementById('addBotModal').classList.remove('show'); }

    function extractArray(apiResponse, key) {
      if (Array.isArray(apiResponse)) return apiResponse;
      if (apiResponse && typeof apiResponse === 'object') {
        if (Array.isArray(apiResponse[key])) return apiResponse[key];
        if (Array.isArray(apiResponse.data)) return apiResponse.data;
      }
      return [];
    }

    async function handleAddBot(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      const username = document.getElementById('botUsername').value.trim();
      const host = document.getElementById('botHost').value.trim();
      const port = Number(document.getElementById('botPort').value);

      submitBtn.disabled = true;
      submitBtn.innerText = 'Bot Bağlanıyor... ⏳';

      try {
        const res = await fetch('/api/bots/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            username, 
            host, 
            port, 
            ownerToken: MY_OWNER_TOKEN // Sahiplik jetonu gönderiliyor
          })
        });

        const data = await res.json();
        if (data.success) {
          closeModal();
          document.getElementById('addBotForm').reset();
          document.getElementById('botPort').value = '25565';
          await fetchDashboardData();
        } else {
          alert('❌ Hata: ' + (data.message || 'Bot eklenemedi.'));
        }
      } catch (err) {
        alert('❌ Sunucuya bağlanırken iletişim hatası oluştu.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'En Boş Sunucuya Atarak Başlat 🚀';
      }
    }

    async function stopBot(botId, username) {
      if (!confirm(`'${username}' botunu durdurmak istediğinize emin misiniz?`)) return;

      try {
        const res = await fetch('/api/bots/stop', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            id: botId,
            ownerToken: MY_OWNER_TOKEN // Sahiplik jetonu ile silme isteği
          })
        });

        const data = await res.json();
        if (data.success) {
          await fetchDashboardData();
        } else {
          alert('❌ ' + (data.message || 'Bot durdurulamadı.'));
        }
      } catch (err) {
        alert('❌ Sunucuyla iletişim hatası oluştu.');
      }
    }

    async function fetchDashboardData() {
      try {
        const [nodesRes, botsRes] = await Promise.all([
          fetch('/api/nodes'),
          fetch('/api/bots')
        ]);

        const rawNodes = await nodesRes.json();
        const rawBots = await botsRes.json();

        const nodes = extractArray(rawNodes, 'nodes');
        const bots = extractArray(rawBots, 'bots');

        document.getElementById('total-nodes').innerText = nodes.length;
        document.getElementById('total-bots').innerText = bots.length;

        const container = document.getElementById('server-container');
        if (nodes.length === 0) {
          container.innerHTML = '<div class="empty-state">Henüz bağlı olan aktif Node (Server) bulunmuyor.</div>';
          return;
        }

        container.innerHTML = nodes.map(node => {
          const maxBots = node.maxBots || 10;
          
          const nodeBots = bots.filter(b => b.nodeId === node.id || b.node_id === node.id);
          const currentBots = nodeBots.length || node.currentBots || 0;
          const percentage = Math.min((currentBots / maxBots) * 100, 100);
          
          let fillStyle = "background: linear-gradient(90deg, var(--accent), #818cf8);";
          if (percentage >= 100) fillStyle = "background: var(--red);";
          else if (percentage >= 80) fillStyle = "background: var(--yellow);";

          const botChipsHtml = nodeBots.length > 0 
            ? nodeBots.map(b => {
                const isMyBot = b.ownerToken === MY_OWNER_TOKEN;
                return `
                  <span class="bot-chip ${isMyBot ? 'mine' : ''}">
                    🤖 ${b.username}
                    ${isMyBot ? `<span class="btn-stop" title="Senin botun - Durdur" onclick="stopBot('${b.id}', '${b.username}')">✕</span>` : ''}
                  </span>
                `;
              }).join('')
            : `<span class="bot-chip">Bot Yok</span>`;

          const isOnline = node.online !== false;

          return `
            <div class="server-card">
              <div>
                <div class="server-header">
                  <div class="server-title">🌐 ${node.name || node.id}</div>
                  <div class="status-indicator ${isOnline ? '' : 'offline'}">
                    <div class="status-dot"></div> ${isOnline ? 'Aktif' : 'Çevrimdışı'}
                  </div>
                </div>
                <div class="bot-capacity">
                  <div class="capacity-info">
                    <span>Bot Kapasitesi</span>
                    <span><strong>${currentBots}</strong> / ${maxBots} Bot</span>
                  </div>
                  <div class="progress-bar">
                    <div class="progress-fill" style="width: ${percentage}%; ${fillStyle}"></div>
                  </div>
                </div>
              </div>
              <div class="bot-list">
                ${botChipsHtml}
              </div>
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error("Dashboard verisi güncellenirken hata:", err);
      }
    }

    setInterval(fetchDashboardData, 3000);
    fetchDashboardData();
  </script>
</body>
</html>
