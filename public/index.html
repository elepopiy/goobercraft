<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GooberCraft Builder</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050816;
      --panel: rgba(15, 23, 42, 0.92);
      --border: rgba(255,255,255,0.12);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #6366f1;
      --success: #22c55e;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #14213d 0%, var(--bg) 55%, #02050d 100%);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .app {
      width: min(100%, 980px);
      display: grid;
      gap: 20px;
      grid-template-columns: 1.15fr 0.85fr;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }
    h1, h2 { margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 16px; line-height: 1.6; }
    form { display: grid; gap: 12px; }
    label { font-size: 0.9rem; color: var(--muted); }
    input, button {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(2, 6, 23, 0.7);
      color: var(--text);
      font-size: 1rem;
    }
    input:focus { outline: 2px solid rgba(56, 189, 248, 0.35); border-color: var(--accent); }
    button {
      cursor: pointer;
      font-weight: 700;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border: none;
      margin-top: 6px;
    }
    button:disabled { opacity: 0.7; cursor: wait; }
    .status {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
      min-height: 48px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status.info { color: #bae6fd; background: rgba(14, 116, 144, 0.18); }
    .status.success { color: #bbf7d0; background: rgba(34, 197, 94, 0.16); }
    .status.error { color: #fecaca; background: rgba(239, 68, 68, 0.16); }
    .bot-list { display: grid; gap: 10px; }
    .bot-item {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
    }
    .bot-name { font-weight: 700; }
    .bot-meta { color: var(--muted); font-size: 0.85rem; }
    .pill {
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 0.78rem;
      background: rgba(56,189,248,0.16);
      color: #bae6fd;
      white-space: nowrap;
    }
    @media (max-width: 800px) {
      .app { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="panel">
      <h1>Builder Mode</h1>
      <p>Bu sayfa yalnızca builder bot oluşturma ve izleme odaklıdır.</p>
      <form id="builderForm">
        <label for="username">BOT İSMİ</label>
        <input id="username" name="username" placeholder="Builder_01" required />
        <label for="host">SUNUCU / IP</label>
        <input id="host" name="host" placeholder="play.example.com" required />
        <label for="port">PORT</label>
        <input id="port" name="port" type="number" value="25565" min="1" max="65535" required />
        <button id="submitBtn" type="submit">Builder Bot Başlat</button>
      </form>
      <div id="status" class="status info">Hazır. Builder botu başlatmak için formu doldur.</div>
    </section>

    <section class="panel">
      <h2>Aktif Builder Botlar</h2>
      <div id="botList" class="bot-list">Yükleniyor...</div>
    </section>
  </main>

  <script>
    const API_BASE = '';

    function getOwnerToken() {
      const stored = localStorage.getItem('goober_session_token');
      if (stored) return stored;
      let token = localStorage.getItem('goober_owner_token');
      if (!token) {
        token = 'GC_' + Math.random().toString(36).slice(2, 10).toUpperCase() + '_' + Date.now().toString(16);
        localStorage.setItem('goober_owner_token', token);
      }
      return token;
    }

    const statusEl = document.getElementById('status');
    const botListEl = document.getElementById('botList');
    const form = document.getElementById('builderForm');
    const submitBtn = document.getElementById('submitBtn');

    function setStatus(message, kind = 'info') {
      statusEl.className = `status ${kind}`;
      statusEl.textContent = message;
    }

    async function loadBots() {
      try {
        const res = await fetch(`${API_BASE}/api/bots`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const bots = Array.isArray(data?.bots) ? data.bots : [];
        const builderBots = bots.filter((bot) => (bot.profile || 'stable') === 'builder' || bot.username?.toLowerCase().includes('builder'));

        if (builderBots.length === 0) {
          botListEl.innerHTML = '<div class="bot-item"><div><div class="bot-name">Henüz builder bot yok</div><div class="bot-meta">Yeni bir builder bot başlatın.</div></div><span class="pill">Beklemede</span></div>';
          return;
        }

        botListEl.innerHTML = builderBots.map((bot) => `
          <div class="bot-item">
            <div>
              <div class="bot-name">${bot.username || 'Builder Bot'}</div>
              <div class="bot-meta">${bot.host || '-'}:${bot.port || 25565}</div>
            </div>
            <span class="pill">${bot.nodeId || 'local'}</span>
          </div>
        `).join('');
      } catch (err) {
        botListEl.innerHTML = '<div class="bot-item"><div><div class="bot-name">Liste alınamadı</div><div class="bot-meta">Backend bağlantısını kontrol edin.</div></div></div>';
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const username = document.getElementById('username').value.trim();
      const host = document.getElementById('host').value.trim();
      const port = Number(document.getElementById('port').value || 25565);

      if (!username || !host) {
        setStatus('Kullanıcı adı ve sunucu adresi zorunlu.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Başlatılıyor...';
      setStatus('Builder bot başlatılıyor...', 'info');

      try {
        const res = await fetch(`${API_BASE}/api/bots/create`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, host, port, ownerToken: getOwnerToken(), profile: 'builder' })
        });
        const data = await res.json();

        if (!res.ok || !data?.success) {
          throw new Error(data?.message || 'Bot başlatılamadı.');
        }

        setStatus(`Builder bot başlatıldı: ${username}`, 'success');
        form.reset();
        document.getElementById('port').value = '25565';
        await loadBots();
      } catch (err) {
        setStatus(err.message || 'Bağlantı hatası.', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Builder Bot Başlat';
      }
    });

    window.addEventListener('load', () => {
      loadBots();
      setStatus('Hazır. Builder botu başlatmak için formu doldur.', 'info');
    });
  </script>
</body>
</html>
